<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>巧手拾遗 · 鲁班锁拼合</title></head><body><style>
#luban-game[hidden]{display:none!important}#luban-game{position:fixed;inset:0;z-index:70;background:#21180fe8;display:grid;place-items:center;padding:16px;color:#49351f;font-family:serif;overflow:auto}
.luban-panel{width:min(1080px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#f8eedb;border:2px solid #bd9559;border-radius:20px;padding:clamp(14px,3vw,28px);box-sizing:border-box;box-shadow:0 18px 80px #0008}
.luban-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.luban-heading h1{font-size:clamp(23px,4vw,34px);margin:0;color:#822f22}.luban-eyebrow{font-size:13px;color:#806243;letter-spacing:.15em;margin:0 0 7px}.luban-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;margin-top:14px}
#luban-board{position:relative;aspect-ratio:1.32;background:radial-gradient(ellipse,#fff9eb,#e5d0ad);border:1px solid #cdb58b;border-radius:12px;overflow:hidden;isolation:isolate}.luban-grid{position:absolute;inset:10%;background-image:linear-gradient(#9c784b12 1px,transparent 1px),linear-gradient(90deg,#9c784b12 1px,transparent 1px);background-size:12.5% 12.5%;pointer-events:none}
.luban-slot{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border:1px dashed #9e7b49;border-radius:50%;background:#fff9e9cf;color:#79572c;font:700 16px serif;z-index:20;cursor:pointer}.luban-slot.active{outline:3px solid #b68b44;outline-offset:4px;background:#ffedbd}.luban-slot:disabled{visibility:hidden}
#luban-finished-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:35;pointer-events:none}#luban-board.is-complete .luban-piece{visibility:hidden}
.luban-piece{position:absolute;width:44%;height:auto;transform:translate(-50%,-50%) rotate(var(--angle));pointer-events:none;transition:left .28s ease,top .28s ease,transform .28s ease;filter:drop-shadow(0 8px 5px #422b2433)}.luban-piece.moving{z-index:30;filter:drop-shadow(0 0 5px #fff3a1)}
#luban-tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.luban-card{position:relative;border:1px solid #ccb38a;background:#fff9ed;border-radius:9px;padding:4px;cursor:pointer;color:#674627;font:600 15px serif}.luban-card img{width:100%;aspect-ratio:1.5;object-fit:contain;display:block}.luban-card[aria-pressed=true]{outline:3px solid #a24630}.luban-card:disabled{opacity:.55;cursor:default}.luban-card small{position:absolute;right:4px;top:4px;color:#735f39}
.luban-controls{display:grid;grid-template-columns:repeat(3,44px);justify-content:center;gap:5px;margin:12px 0}.luban-controls button,.luban-action{border:1px solid #b49363;border-radius:7px;background:#fff9e9;color:#634022;padding:9px;font:inherit;cursor:pointer}.luban-controls button:disabled,.luban-action:disabled{opacity:.45;cursor:default}.luban-primary{background:#8c3828;color:#fff3d8;border-color:#8c3828;width:100%}.luban-footer{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}#luban-status{min-height:2.8em;line-height:1.5;font-size:15px;margin:10px 0}#luban-hint{font-size:14px;color:#806141;line-height:1.6}#luban-count{font-size:14px;color:#806141;white-space:nowrap}#luban-complete{border-top:1px solid #cdb58b;margin-top:12px;padding-top:12px;color:#7b3925}#luban-game button:focus-visible{outline:3px solid #1a648d;outline-offset:3px}
@media(max-width:650px){.luban-layout{grid-template-columns:1fr;gap:10px}.luban-panel{padding:14px}.luban-side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.luban-side #luban-status,.luban-side #luban-hint{grid-column:1/-1;margin:2px 0}.luban-controls{margin:4px 0}.luban-card img{aspect-ratio:1.6}.luban-slot{width:30px;height:30px}#luban-board{aspect-ratio:1.35}}
@media(prefers-reduced-motion:reduce){.luban-piece{transition:none}}
</style>
<section id="luban-game" hidden role="dialog" aria-modal="true" aria-labelledby="luban-title">
<div class="luban-panel"><p class="luban-eyebrow">长安一日 · 巧手拾遗</p><div class="luban-heading"><h1 id="luban-title" tabindex="-1">把鲁班锁拼回来</h1><span id="luban-count">已拼合 0 / 6</span></div>
<p id="luban-hint">先点击木块，再点击亮起的字母卡槽逐步移入。也可以用方向按钮微调位置。</p>
<div class="luban-layout"><div id="luban-board" aria-label="鲁班锁拼合区"><div class="luban-grid"></div><img id="luban-finished-image" src="assets/luban/assembled.png" alt="六根木块拼合后的鲁班锁" hidden></div><div class="luban-side"><div id="luban-tray" aria-label="六根独立木块"></div><div><div class="luban-controls" aria-label="移动木块"><span></span><button data-move="0,-1" aria-label="向上移动">↑</button><span></span><button data-move="-1,0" aria-label="向左移动">←</button><button id="luban-turn" aria-label="旋转木块">↻</button><button data-move="1,0" aria-label="向右移动">→</button><span></span><button data-move="0,1" aria-label="向下移动">↓</button></div><button id="luban-insert" class="luban-action luban-primary">向卡槽移动一步</button></div><p id="luban-status" role="status" aria-live="polite">第一步：选择 A，作为锁身的第一根木块。</p></div></div>
<div id="luban-complete" hidden>六根木块已归位，钥匙榫将锁身固定。鲁班锁拼合完成！</div>
<div class="luban-footer"><button id="luban-reset" class="luban-action">重新拼合</button><button id="luban-continue" class="luban-action" hidden>再拼一次 →</button></div>
</div></section>
<script>
(function(){'use strict';
var root=document.getElementById('luban-game'),board=document.getElementById('luban-board'),tray=document.getElementById('luban-tray'),status=document.getElementById('luban-status');
var specs=[['A',4,4,0,'先放入红色锁身。'],['B',4,3,90,'转为竖向，与 A 交叉。'],['C',3,4,0,'从左侧移入，拼入中心。'],['D',5,5,0,'移到 C 的对侧。'],['E',4,5,90,'转为竖向，对齐中央孔位。'],['F',5,4,0,'最后插入直条钥匙榫。']];
var pieces=[],selected=-1,count=0,started=false;window.__lubanOpen=false;window.__lubanComplete=false;
function position(el,x,y){el.style.left=(10+x*10)+'%';el.style.top=(10+y*10)+'%';}
function say(t){status.textContent=t;}
function controls(){root.querySelectorAll('[data-move],#luban-turn,#luban-insert').forEach(function(b){b.disabled=selected<0;});}
function select(i){if(i!==count){say('请先拼合 '+specs[count][0]+'，再安装这根木块。');return;}selected=i;var p=pieces[i];p.img.hidden=false;p.img.classList.add('moving');pieces.forEach(function(q,j){q.card.setAttribute('aria-pressed',String(j===i));});controls();say('已选择 '+specs[i][0]+'。'+specs[i][4]+' 点击亮起的卡槽移动。');}
function check(){if(selected<0)return;var i=selected,p=pieces[i],s=specs[i];if(p.x!==s[1]||p.y!==s[2])return;if(p.angle!==s[3]){say(s[0]+' 已到达位置，请点击 ↻ 调整为竖向。');return;}p.img.classList.remove('moving');p.card.disabled=true;p.card.querySelector('small').textContent='✓';p.slot.disabled=true;selected=-1;count++;p.card.setAttribute('aria-pressed','false');document.getElementById('luban-count').textContent='已拼合 '+count+' / 6';controls();if(count===6){board.classList.add('is-complete');document.getElementById('luban-finished-image').hidden=false;window.__lubanComplete=true;document.getElementById('luban-complete').hidden=false;document.getElementById('luban-continue').hidden=false;say('拼合完成！六根木块已全部归位。');document.getElementById('luban-continue').focus();}else{pieces[count].slot.classList.add('active');say(s[0]+' 已卡入。下一根选择 '+specs[count][0]+'。'+specs[count][4]);}}
function move(dx,dy){if(selected<0)return;var p=pieces[selected];p.x=Math.max(0,Math.min(8,p.x+dx));p.y=Math.max(0,Math.min(8,p.y+dy));position(p.img,p.x,p.y);check();}
function insert(){if(selected<0){say('请先点击下方的 '+specs[count][0]+' 木块。');return;}var p=pieces[selected],s=specs[selected];if(p.x!==s[1])move(Math.sign(s[1]-p.x),0);else if(p.y!==s[2])move(0,Math.sign(s[2]-p.y));else check();}
function reset(){board.classList.remove('is-complete');document.getElementById('luban-finished-image').hidden=true;board.querySelectorAll('.luban-piece,.luban-slot').forEach(function(e){e.remove();});tray.replaceChildren();pieces=[];selected=-1;count=0;window.__lubanComplete=false;document.getElementById('luban-count').textContent='已拼合 0 / 6';document.getElementById('luban-complete').hidden=true;document.getElementById('luban-continue').hidden=true;
specs.forEach(function(s,i){var img=document.createElement('img');img.src='assets/luban/'+s[0]+'.png';img.alt=s[0]+' 木块';img.className='luban-piece';img.style.setProperty('--angle','0deg');img.style.zIndex=String(i+1);img.hidden=true;position(img,2,1);board.appendChild(img);var slot=document.createElement('button');slot.className='luban-slot'+(i===0?' active':'');slot.textContent=s[0];slot.setAttribute('aria-label',s[0]+' 拼合位置，点击逐步移入');position(slot,s[1],s[2]);slot.onclick=function(){if(i!==count){say('当前应拼入 '+specs[count][0]+'。');return;}insert();};board.appendChild(slot);var card=document.createElement('button');card.className='luban-card';card.setAttribute('aria-pressed','false');var thumb=img.cloneNode();thumb.className='';thumb.removeAttribute('style');thumb.hidden=false;card.appendChild(thumb);card.appendChild(document.createTextNode(s[0]));card.appendChild(document.createElement('small'));card.onclick=function(){select(i);};tray.appendChild(card);pieces.push({img:img,slot:slot,card:card,x:2,y:1,angle:0});});controls();say('第一步：选择 A，作为锁身的第一根木块。');}
root.querySelectorAll('[data-move]').forEach(function(b){b.onclick=function(){var v=b.dataset.move.split(',').map(Number);move(v[0],v[1]);};});document.getElementById('luban-turn').onclick=function(){if(selected<0)return;var p=pieces[selected];p.angle=(p.angle+90)%180;p.img.style.setProperty('--angle',p.angle+'deg');check();};document.getElementById('luban-insert').onclick=insert;document.getElementById('luban-reset').onclick=reset;
function open(){if(started)return;started=true;window.__lubanOpen=true;root.hidden=false;reset();document.getElementById('luban-title').focus();}
window.addEventListener('luban-requested',open,{once:true});document.getElementById('luban-continue').onclick=function(){if(count!==6)return;reset();};
root.addEventListener('keydown',function(e){if(e.key==='Tab'){var nodes=Array.from(root.querySelectorAll('button:not(:disabled):not([hidden])'));var first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.id==='luban-title')){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
})();
</script>
<script>window.dispatchEvent(new Event("luban-requested"));</script></body></html>
