<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>巧手拾遗 · 鲁班锁拼合</title></head><body><style>
#luban-game[hidden]{display:none!important}#luban-game{position:fixed;inset:0;z-index:70;background:#21180fe8;display:grid;place-items:center;padding:16px;color:#49351f;font-family:serif;overflow:auto}
.luban-panel{width:min(1080px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#f8eedb;border:2px solid #bd9559;border-radius:20px;padding:clamp(14px,3vw,28px);box-sizing:border-box;box-shadow:0 18px 80px #0008}
.luban-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.luban-heading h1{font-size:clamp(23px,4vw,34px);margin:0;color:#822f22}.luban-eyebrow{font-size:13px;color:#806243;letter-spacing:.15em;margin:0 0 7px}.luban-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;margin-top:14px}
#luban-board{position:relative;aspect-ratio:1.32;background:radial-gradient(ellipse,#fff9eb,#e5d0ad);border:1px solid #cdb58b;border-radius:12px;overflow:hidden;isolation:isolate}.luban-grid{position:absolute;inset:10%;background-image:linear-gradient(#9c784b12 1px,transparent 1px),linear-gradient(90deg,#9c784b12 1px,transparent 1px);background-size:12.5% 12.5%;pointer-events:none}
.luban-slot{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border:1px dashed #9e7b49;border-radius:50%;background:#fff9e9cf;color:#79572c;font:700 16px serif;z-index:20;cursor:pointer}.luban-slot.active{outline:3px solid #b68b44;outline-offset:4px;background:#ffedbd}.luban-slot:disabled{visibility:hidden}
#luban-finished-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:35;pointer-events:none}#luban-board.is-complete .luban-piece{visibility:hidden}
.luban-piece{position:absolute;width:44%;height:auto;transform:translate(-50%,-50%) rotate(var(--angle));pointer-events:none;transition:left .28s ease,top .28s ease,transform .28s ease;filter:drop-shadow(0 8px 5px #422b2433)}.luban-piece.moving{z-index:30;filter:drop-shadow(0 0 5px #fff3a1)}
#luban-tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.luban-card{position:relative;border:1px solid #ccb38a;background:#fff9ed;border-radius:9px;padding:4px;cursor:pointer;color:#674627;font:600 15px serif}.luban-card img{width:100%;aspect-ratio:1.5;object-fit:contain;display:block}.luban-card[aria-pressed=true]{outline:3px solid #a24630}.luban-card:disabled{opacity:.55;cursor:default}.luban-card small{position:absolute;right:4px;top:4px;color:#735f39}
.luban-controls{display:grid;grid-template-columns:repeat(3,44px);justify-content:center;gap:5px;margin:12px 0}.luban-controls button,.luban-action{border:1px solid #b49363;border-radius:7px;background:#fff9e9;color:#634022;padding:9px;font:inherit;cursor:pointer}.luban-controls button:disabled,.luban-action:disabled{opacity:.45;cursor:default}.luban-primary{background:#8c3828;color:#fff3d8;border-color:#8c3828;width:100%}.luban-footer{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}#luban-status{min-height:2.8em;line-height:1.5;font-size:15px;margin:10px 0}#luban-hint{font-size:14px;color:#806141;line-height:1.6}#luban-count{font-size:14px;color:#806141;white-space:nowrap}#luban-complete{border-top:1px solid #cdb58b;margin-top:12px;padding-top:12px;color:#7b3925}#luban-game button:focus-visible{outline:3px solid #1a648d;outline-offset:3px}
@media(max-width:650px){.luban-layout{grid-template-columns:1fr;gap:10px}.luban-panel{padding:14px}.luban-side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.luban-side #luban-status,.luban-side #luban-hint{grid-column:1/-1;margin:2px 0}.luban-controls{margin:4px 0}.luban-card img{aspect-ratio:1.6}.luban-slot{width:30px;height:30px}#luban-board{aspect-ratio:1.35}}
@media(prefers-reduced-motion:reduce){.luban-piece{transition:none}}

#luban-board svg{display:block;width:100%;height:100%}.luban-board-caption{position:absolute;top:13px;left:14px;padding:6px 10px;border:1px solid #bca07877;background:#fff7e3dc;border-radius:5px;color:#75502f;font-size:13px;pointer-events:none}.luban-axis-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.luban-axis-controls .luban-primary{grid-column:1/-1}.luban-view-controls{display:flex;gap:8px;margin:10px 0;justify-content:center}.luban-view-controls button{font-size:13px;padding:6px 12px}.luban-side>p{margin-top:10px}#luban-board:focus-visible{outline:3px solid #9c6936;outline-offset:3px}@media(max-width:650px){.luban-axis-controls{margin:0}.luban-side{align-items:start}.luban-board-caption{font-size:11px;top:8px;left:8px}.luban-view-controls{margin:5px 0}}

/* Keep scene geometry independent of text wrapping and SVG intrinsic sizing. */
.luban-panel{height:min(868px,calc(100dvh - 32px));scrollbar-gutter:stable;overflow-anchor:none}
.luban-layout{align-items:start}#luban-board svg{position:absolute;inset:0}
#luban-status{min-height:4.5em}.luban-board-caption{font-variant-numeric:tabular-nums}
</style><section id="luban-game" hidden role="dialog" aria-modal="true" aria-labelledby="luban-title">
<div class="luban-panel"><p class="luban-eyebrow">长安一日 · 巧手拾遗</p><div class="luban-heading"><h1 id="luban-title" tabindex="-1">把鲁班锁拼回来</h1><span id="luban-count">已拼合 0 / 6</span></div>
<p id="luban-hint">点选木块 → 转正凹槽 → 沿导轨推入。每一步都能看清接缝，最后插入钥匙榫。</p>
<div class="luban-layout"><div><div id="luban-board" aria-label="鲁班锁立体拼合区"></div><div class="luban-view-controls"><button class="luban-action" data-view="-1">↶ 左转查看</button><button class="luban-action" data-view="1">右转查看 ↷</button></div></div><div class="luban-side"><div id="luban-tray" aria-label="六根棕色木块"></div><div class="luban-axis-controls"><button id="luban-turn" class="luban-action">转正凹槽 ↻</button><button id="luban-back" class="luban-action">向外退出</button><button id="luban-insert" class="luban-action luban-primary">沿导轨推入 →</button></div><p id="luban-status" role="status" aria-live="polite">选择 A，开始拼合。</p></div></div>
<div id="luban-complete" hidden>六根木块已在同一结构中卡合，钥匙榫已归位。转动视角，检查紧密贴合的接缝。</div>
<div class="luban-footer"><div><button id="luban-undo" class="luban-action">撤回上一根</button> <button id="luban-reset" class="luban-action">重新拼合</button></div><button id="luban-continue" class="luban-action" hidden>再拼一次 →</button></div></div></section><script src="assets/luban/game.js"></script><script>window.dispatchEvent(new Event("luban-requested"));</script></body></html>
